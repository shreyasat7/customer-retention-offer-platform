# ---------------------------------------------------------------------------
#  Inventory for the Customer Retention Offer Platform
#
#  The target node is this machine. Constraint C2 says everything runs on one
#  laptop, so `ansible_connection=local` stands in for SSH to a remote host.
#  Swapping in a real host means changing these two lines and nothing else -
#  no task in any role assumes it is running locally.
# ---------------------------------------------------------------------------

[crop_app]
crop-node-01 ansible_connection=local ansible_host=localhost

[crop_app:vars]
node_role=application
node_environment=demo
# Use the interpreter Ansible itself runs on. Auto-discovery picks the Homebrew
# python3.14, which has no docker SDK, so community.docker modules fail there.
ansible_python_interpreter={{ ansible_playbook_python }}
