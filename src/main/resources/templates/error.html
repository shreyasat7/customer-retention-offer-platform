<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><title>Something went wrong · CROP</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh">
  <div class="card" style="max-width:480px;width:100%">
    <div class="card-body" style="text-align:center;padding:40px 32px">
      <div style="font-size:42px;font-weight:750;letter-spacing:-1.5px;color:var(--ink-3)"
           th:text="${status} ?: 'Error'">500</div>
      <h2 style="margin:10px 0 8px;font-size:19px" th:text="${error} ?: 'Unexpected error'">Error</h2>
      <p style="color:var(--ink-3);font-size:14px;margin:0 0 22px"
         th:text="${message} ?: 'The request could not be completed.'">Details</p>
      <a class="btn btn--primary" th:href="@{/dashboard}">Back to dashboard</a>
    </div>
  </div>
</body>
</html>
