# ---------------------------------------------------------------- application
spring.application.name=Customer Retention Offer Platform
app.version=@project.version@
app.database.label=H2 file database

# ------------------------------------------------------------------- server
# Overridden per environment: 8070 local, 8095 under test, 8080 inside the container.
server.port=${APP_PORT:8070}
server.error.whitelabel.enabled=false

# ---------------------------------------------------------------- datastore
# A file-based H2 database keeps the MVP dependency-free (constraint C4) while still
# surviving restarts, which matters for the rollback demonstration in Task 14.
spring.datasource.url=jdbc:h2:file:${CROP_DATA_DIR:./data}/retention
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=crop
spring.datasource.password=crop
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# -------------------------------------------------------------------- views
spring.thymeleaf.cache=false

# ----------------------------------------------------------------- actuator
# /actuator/health is the probe used by the Jenkins deploy stage and by Ansible.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.version=@project.version@

# ------------------------------------------------------------------ logging
logging.level.root=INFO
logging.level.com.crop.retention=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %-38logger{38} : %msg%n
